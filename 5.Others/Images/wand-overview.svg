<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Muggles' Wand 魔杖功能示意</title>
<desc id="desc">ESP32-S3 魔杖识别挥杖动作，可控制照明、空中光绘、蓝牙遥控，支持自定义手势模型和扩展配件。</desc>
